<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Guessing Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header id="stats-board">
        <h1>Movie Guessing Game</h1>
        <p aria-live="polite">Movie <span id="movieCounter">1</span> of 10</p>
    </header>

    <main>
        <section id="guessing-area" aria-labelledby="guessing-heading">
            <h2 id="guessing-heading">Make your guess</h2>
            <p>Points: <output id="pointDisplay">20</output></p>
            <input type="text" id="guessInput" aria-label="Movie title" placeholder="Guess the movie...">
            <button type="button" onclick="submitGuess()">Submit</button>
            <p id="feedbackMessage" aria-live="polite"></p>
        </section>

        <section id="clues-board" aria-label="Clue options">
            <button type="button" onclick="buyClue('Year', 1)">
                <span>Year (1 pt)</span>
                <span id="display-Year" aria-live="polite"></span>
            </button>
            <button type="button" onclick="buyClue('Director', 2)">
                <span>Director (2 pts)</span>
                <span id="display-Director" aria-live="polite"></span>
            </button>
            <button type="button" onclick="buyClue('Actors', 3)">
                <span>Cast (3 pts)</span>
                <span id="display-Actors" aria-live="polite"></span>
            </button>
            <button type="button" onclick="buyClue('Plot', 4)">
                <span>Plot (4 pts)</span>
                <span id="display-Plot" aria-live="polite"></span>
            </button>
        </section>

        <section id="movie-result" aria-label="Movie result" aria-live="polite" hidden>
            <img id="moviePoster" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" hidden>
            <p id="posterUnavailable" hidden>Poster unavailable.</p>
            <button type="button" id="nextMovieButton" onclick="advanceGame()">Next movie</button>
        </section>
    </main>
</body>
</html>
